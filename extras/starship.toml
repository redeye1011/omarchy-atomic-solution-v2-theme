add_newline = true
command_timeout = 200

format = """
$directory\
$git_branch\
$git_status\
$cmd_duration\
$line_break\
$character"""

[character]
success_symbol = "[⬡](bold #2fd3c9) [❯](#5cebe2)"
error_symbol = "[⬡](bold #f2645a) [❯](#ff7b72)"

[directory]
truncation_length = 3
truncation_symbol = "…/"
style = "bold #e4eaec"
repo_root_style = "bold #2fd3c9"
repo_root_format = "[# ](dim #788b94)[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "
read_only = " 󰌾"
read_only_style = "#f2645a"

[git_branch]
symbol = "󰊠 "
style = "italic #5cebe2"
format = "on [$symbol$branch]($style) "

[git_status]
style = "#2fd3c9"
format = '([\[$all_status\]]($style) )'
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
modified = "!"
staged = "+"
untracked = "?"

[cmd_duration]
min_time = 500
style = "dim #80ffdb"
format = "took [$duration]($style) "
